name: Server tests

on:
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "index.html"
      - ".github/workflows/server-tests.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "src/**"
      - "index.html"
      - ".github/workflows/server-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Run server and client regression tests
        run: npm test
